    BUILD_ARCH: arm64
    HOST_ARCH: arm64
  extends: .build_patched
  tags:
    - arm64
  artifacts:
    when: always
    paths:
      - output.log
      - changes-arm64
      - buildlogs

build_patched_armhf:
  variables:
    BUILD_ARCH: armhf
    HOST_ARCH: armhf
