.build_linux:
  stage: build
  #when: manual
  extends: .setup
  script: |
    set -x
    BASESUITE='$[[ inputs.basesuite ]]'
    export BASESUITE
    OURSUITE='$[[ inputs.oursuite ]]'
    export OURSUITE
    MIRROR='$[[ inputs.mirror ]]'
    export MIRROR
    echo "MIRROR: $[[ inputs.mirror ]]" >&2
    LINUX_BRANCH='$[[ inputs.linux_branch ]]'
    if [ -n '$LINUX_BRANCH' ]; then
      export LINUX_BRANCH
      echo 'LINUX_BRANCH: $LINUX_BRANCH' >&2
    fi
    LINUX_CLONE_DEPTH='$[[ inputs.linux_clone_depth ]]'
    case "$LINUX_CLONE_DEPTH" in *[!0123456789]* | 0?* | "")
      echo "inputs.linux_clone_depth must be numeric" >&2
      exit 1
    esac
    export LINUX_CLONE_DEPTH
    # gitlab has pipefail turned on by default, so the below will fail if
    # build.sh fails despite the command being piped to filter-output.
    runuser -u build -- sh -xc '. ./common.sh; cd linux; . ./build.sh' 2>&1 | ./filter-output
    # move to arch-qualified path
    mv changes "changes-$HOST_ARCH"
    # kernel specific checks only on arm64
    if [ "$HOST_ARCH" != "arm64" ]; then
      exit 0
    fi
    for module in 'kernel/drivers/gpu/drm/imx\(/cdns\)\?/cdns_mhdp_imx.ko' \
                  'kernel/drivers/gpu/drm/bridge/cadence/cdns-mhdp8546.ko' \
                  'kernel/drivers/net/mdio/mdio-mux-meson-g12a.ko'; do
      # since kernel 6.19, modules are in the linux-modules-* package
      found=0
      for p in "changes-$HOST_ARCH"/linux-image-*-mnt-reform-arm64_*_arm64.deb \
               "changes-$HOST_ARCH"/linux-modules-*-mnt-reform-arm64_*_arm64.deb; do
        [ -e "$p" ] || continue
        if dpkg-deb -c "$p" | grep "$module"; then
          found=1
          break
        fi
      done
      if [ "$found" -eq 0 ]; then
        echo "$module missing" >&2
        exit 1
      else
        echo "$module found" >&2
      fi
    done
    for dtb in amlogic/meson-g12b-bananapi-cm4-mnt-pocket-reform.dtb freescale/imx8mp-mnt-pocket-reform.dtb freescale/imx8mq-mnt-reform2.dtb freescale/imx8mq-mnt-reform2-hdmi.dtb amlogic/meson-g12b-bananapi-cm4-mnt-reform2.dtb freescale/imx8mp-mnt-reform2.dtb freescale/fsl-ls1028a-mnt-reform2.dtb rockchip/rk3588-mnt-reform2.dtb; do
      # since kernel 6.19, dtbs are in the linux-base-* package
      found=0
      for p in "changes-$HOST_ARCH"/linux-image-*-mnt-reform-arm64_*_arm64.deb \
               "changes-$HOST_ARCH"/linux-base-*-mnt-reform-arm64_*_arm64.deb; do
        [ -e "$p" ] || continue
        if dpkg-deb -c "$p" | grep "/${dtb}\$"; then
          found=1
          break
        fi
      done
      if [ "$found" -eq 0 ]; then
        echo "$dtb missing" >&2
        exit 1
      else
        echo "$dtb found" >&2
      fi
    done
    for f in "changes-$HOST_ARCH"/linux-image-arm64_*_arm64.deb "changes-$HOST_ARCH"/linux-headers-arm64_*_arm64.deb; do
      if [ ! -e "$f" ]; then
        echo "$f does not exist" >&2
        exit 1
      fi
    done
    # check if the produced vmlinuz, initrd and dtb are small enough to fit
    # the u-boot memory loading address spaces for each SoM
    #
    # imx8mq
    # ======
    #
    # ${kernel_addr_r}  = 0x40480000
    # ${ramdisk_addr_r} = 0x44000000
    # ${fdt_addr_r}     = 0x50000000
    #
    # max kernel:  62390272 b == 59.5 MiB
    # max initrd: 201326592 b == 192.0 MiB
    #
    # imx8m+
    # ======
    #
    # The original offsets are:
    # ${kernel_addr_r}  = 0x40480000
    # ${fdt_addr_r}     = 0x43000000
    # ${ramdisk_addr_r} = 0x43800000
    #
    # Additionally, u-boot moves the kernel during boot:
    # Moving Image from 0x40480000 to 0x40600000
    #
    # These get fixed in flash-kernel/ubootenv.d/00reform2_ubootenv to:
    # ${kernel_addr_r}  = 0x40600000
    # ${fdt_addr_r}     = 0x43400000
    # ${ramdisk_addr_r} = 0x43c00000
    #
    # max kernel:  48234496 b == 46.0 MiB
    # max dtb:      8388608 b == 8.0 MiB
    #
    # a311d
    # =====
    #
    # Moves the kernel just as imx8m+ does but does so *after* loading the
    # dtb, so the original kernel offset limits its size
    #
    # ${fdt_addr_r}     = 0x08008000
    # ${kernel_addr_r}  = 0x08080000
    # ${ramdisk_addr_r} = 0x13000000
    # Moving Image from 0x08080000 to 0x08200000
    #
    # max dtb:       491520 b == 0.46875 MiB
    # max kernel: 184025088 b == 175.5 MiB
    #
    # ls1028a
    # =======
    #
    # ${kernel_addr_r}  = 0x81000000
    # ${fdt_addr_r}     = 0x90000000
    # ${ramdisk_addr_r} = 0xa0000000
    #
    # max kernel: 251658240 b == 240.0 MiB
    # max dtb:    268435456 b == 256.0 MiB
    #
    # rk3588
    # ======
    #
    # ${kernel_addr_r}  = 0x02000000
    # ${fdt_addr_r}     = 0x12000000
    # ${ramdisk_addr_r} = 0x12180000
    #
    # max kernel: 268435456 b == 256.0 MiB
    # max dtb:      1572864 b == 1.5 MiB
    #
    # overall
    # =======
    #
    # max kernel: 46.0 MiB (imx8m+)
    # max initrd: 192.0 MiB (imx8mq)
    # max dtb:    1.5 MiB (rk3588)
    #
    # Technically, maximum dtb size is platform dependent, but even the largest
    # of our dtbs does not exceed 0.18 MiB and the largest of all dtbs shipped
    # by Debian is 0.218 MiB we just make sure that *all* of them are below
    # 1.5 MiB.
    #
    # We cannot check initrd size here but its current size (40 MiB) is far
    # below the lowest maximum of 192.0 MiB.
    #
    # since kernel 6.19, dtbs are in the linux-base-* package
    found=0
    for p in "changes-$HOST_ARCH"/linux-image-*-mnt-reform-arm64_*_arm64.deb \
      "changes-$HOST_ARCH"/linux-base-*-mnt-reform-arm64_*_arm64.deb; do
      [ -e "$p" ] || continue
      # try to remove prefix from either linux-image-* or linux-base-*
      kver=${p##changes-arm64/linux-image-}
      kver=${p##changes-arm64/linux-base-}
      kver=${kver%%_*}
      echo "kver: $kver" >&2
      largestdtb=$(dpkg-deb --fsys-tarfile "$p" \
        | tar tv \
        | sed -ne 's#^-rw-r--r-- root/root[ ]\+\([0-9]\+\) [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\} [0-9]\{2\}:[0-9]\{2\} ./usr/lib/modules/'"$kver"'/dtb/\([^ ]\+\.dtb\)$#\1 \2#p' \
        | sort -n \
        | tail -1)
      # if package didn't contain dtbs, continue and try the other
      if [ -z "$largestdtb" ]; then
        echo "W: unable to find dtbs in $p" >&2
        continue;
      fi
      echo "largestdtb: $largestdtb" >&2
      size=${largestdtb%% *}
      name=${largestdtb##* }
      case "$size" in *[!0123456789]* | 0?* | "")
        echo "E: invalid size: $size" >&2
        exit 1
        ;;
      esac
      # maximum dtb size is 1572864 (rk3588)
      if [ "$size" -gt 1572864 ]; then
        echo "E: dtb too large: $name" >&2
        exit 1
      fi
      found=1
      break
    done
    if [ "$found" -eq 0 ]; then
      echo "E: failed to check for largest dtb" >&2
      exit 1
    else
      echo "I: dtb sizes okay" >&2
    fi
    # since kernel 7.2, vmlinuz is in the linux-binary-* package
    # linux-binary-${kver}: /usr/lib/modules/${kver}/vmlinuz
    found=0
    for p in "changes-$HOST_ARCH"/linux-image-*-mnt-reform-arm64_*_arm64.deb \
      "changes-$HOST_ARCH"/linux-binary-*-mnt-reform-arm64_*_arm64.deb; do
      [ -e "$p" ] || continue
      # ignore the exit code of tar when it does not find vmlinuz
      size=$(dpkg-deb --fsys-tarfile "$p" \
        | { \
          tar --to-stdout --extract --wildcards "*/vmlinuz" || : ; \
      } | wc -c)
      if [ "$size" -eq 0 ]; then
        echo "W: vmlinuz is not in $p" >&2
        continue
      fi
      if [ "$size" -lt "$((1024*1024*32))" ]; then
        echo "E: vmlinuz is unexpectedly small: $size" >&2
        exit 1
      fi
      # maximum kernel size is 48234496 (imx8m+)
      if [ "$size" -gt 48234496 ]; then
        echo "E: vmlinuz is too large: $size" >&2
        exit 1
      fi
      found=1
      break
    done
    if [ "$found" -eq 0 ]; then
      echo "E: failed to check for size of vmlinuz" >&2
      exit 1
    else
      echo "I: vmlinuz size okay" >&2
    fi

  after_script: |
    if [ $CI_JOB_STATUS != 'success' ]; then
      # The linux log is ~100 MB large so much too big to be stored by gitlab
      # as the job log. To avoid having to manually browse the artifacts and
      # download the log, grep for common error indicators in the log and
      # display the result here.
      grep -B1 -A3 --color -P '([^"]error:|Error|^ERROR: |[^_W]ERROR|Waiting for unfinished jobs)' linux/linux_*_"${HOST_ARCH}"-*.build
      exit 1
    fi
    if [ -n '$[[ inputs.linux_branch ]]' ]; then
      echo 'LINUX_BRANCH: $[[ inputs.linux_branch ]]'
    fi
    echo "BASESUITE: $[[ inputs.basesuite ]]"
    echo "OURSUITE: $[[ inputs.oursuite ]]"

build_linux_arm64:
  variables:
    BUILD_ARCH: arm64
    HOST_ARCH: arm64
  extends: .build_linux
  tags:
    - arm64
  artifacts:
    when: always
    paths:
      - output.log
      - changes-arm64
      - linux/linux_*_arm64-*.build

build_linux_armhf:
  variables:
    BUILD_ARCH: armhf
    HOST_ARCH: armhf
  extends: .build_linux
  tags:
    - armhf
  artifacts:
    when: always
    paths:
      - output.log
      - changes-armhf
      - linux/linux_*_armhf-*.build

build_linux_i386:
  variables:
    BUILD_ARCH: arm64
    HOST_ARCH: i386
  extends: .build_linux
  tags:
    - arm64
  artifacts:
    when: always
    paths:
      - output.log
      - changes-armhf
      - linux/linux_*_armhf-*.build

build_linux_amd64:
  variables:
    BUILD_ARCH: arm64
    HOST_ARCH: amd64
  extends: .build_linux
  tags:
    - arm64
  artifacts:
    when: always
    paths:
      - output.log
      - changes-amd64
      - linux/linux_*_amd64-*.build

dtbs_check:
  stage: build
  tags:
    - arm64
  needs:
    - job: build_linux_arm64
      artifacts: true
  script: |
    set -exuo pipefail
    apt-get update -o Acquire::AllowReleaseInfoChange=true -o quiet::ReleaseInfoChange=true
    apt-get --yes install --no-install-recommends gcc-aarch64-linux-gnu build-essential bison flex device-tree-compiler git ca-certificates xz-utils libssl-dev bc dt-schema
    dpkg -x ./changes-arm64/linux-source-*.deb ./
    dpkg -x ./changes-arm64/linux-config-*.deb ./
    tar xfJ usr/src/linux-source-*.tar.xz
    cd linux-source-*
    xz --decompress --to-stdout ../usr/src/linux-config-*/config.arm64_none_*arm64.xz > .config
    for dtb in \
      amlogic/meson-g12b-bananapi-cm4-mnt-pocket-reform.dtb \
      freescale/imx8mp-mnt-pocket-reform.dtb \
      freescale/imx8mq-mnt-reform2.dtb \
      freescale/imx8mq-mnt-reform2-hdmi.dtb \
      amlogic/meson-g12b-bananapi-cm4-mnt-reform2.dtb \
      freescale/imx8mp-mnt-reform2.dtb \
      freescale/fsl-ls1028a-mnt-reform2.dtb \
      rockchip/rk3588-mnt-reform2.dtb; do
      set +x
      echo =================================================================
      echo "    $dtb"
      echo =================================================================
      set -x
      make CHECK_DTBS=y "$dtb"
    done

build_qcacld:
  stage: build
  extends: .setup
  tags:
    - arm64
  needs:
    - job: build_linux_arm64
      artifacts: true
  script: |
    set -exuo pipefail
    apt-get update -o Acquire::AllowReleaseInfoChange=true -o quiet::ReleaseInfoChange=true
    apt-get --yes install --no-install-recommends gcc-aarch64-linux-gnu build-essential bison flex device-tree-compiler git ca-certificates xz-utils libssl-dev bc sbuild

    if [ -z ${SOURCE_DATE_EPOCH:+x} ] && git -C . rev-parse 2>/dev/null; then
      SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
    else
      : "${SOURCE_DATE_EPOCH:=$(date --utc +%s)}"
    fi
    export SOURCE_DATE_EPOCH

    KERNEL_ABINAME=$(dpkg-deb --field changes-arm64/linux-image-*-mnt-reform-arm64_*_arm64.deb Package)
    KERNEL_ABINAME=${KERNEL_ABINAME##linux-image-}

    git clone --depth=1 --branch=binary-deb https://source.mnt.re/reform/qcacld2.git

    env --chdir=qcacld2 ./createdeb.sh "$KERNEL_ABINAME" "$(pwd)"/changes-arm64/linux-source-*.deb

    chown build -R .
    runuser -u build -- env --chdir=qcacld2 sbuild --verbose --no-run-lintian --no-run-autopkgtest --extra-package "$(pwd)"/changes-arm64/linux-source-*.deb --extra-package "$(pwd)"/changes-arm64/linux-config-*.deb --no-clean-source
  artifacts:
    when: always
    paths:
      - "reform-qcacld2*.deb"
      - "*.buildinfo"
      - "*.changes"

reprepro:
  stage: reprepro
  extends: .setup
  tags:
    - arm64
  dependencies:
    - build_patched_arm64
    - build_patched_armhf
    - build_patched_amd64
    - build_patched_i386
    - build_linux_arm64
    - build_linux_armhf
    - build_linux_amd64
    - build_linux_i386
    - build_qcacld
  artifacts:
    when: always
    paths:
      - repo
      - variables.sh
  script: |
    set -x
    BASESUITE='$[[ inputs.basesuite ]]'
    export BASESUITE
    OURSUITE='$[[ inputs.oursuite ]]'
    export OURSUITE
    MIRROR='$[[ inputs.mirror ]]'
    export MIRROR
    apt-get update -o Acquire::AllowReleaseInfoChange=true -o quiet::ReleaseInfoChange=true
    apt-get --no-install-recommends -y install reprepro python3 devscripts
    runuser -u build -- sh -x ./reprepro.sh
    {
      echo "CI_PROJECT_NAMESPACE=\"$CI_PROJECT_NAMESPACE\"";
      echo "CI_COMMIT_BRANCH=\"$CI_COMMIT_BRANCH\"";
      echo "CI_COMMIT_REF_NAME=\"$CI_COMMIT_REF_NAME\"";
      echo "BASESUITE=\"$[[ inputs.basesuite ]]\"";
      echo "OURSUITE=\"$[[ inputs.oursuite ]]\"";
    } | tee variables.sh
  after_script: |
    echo "To use the artifacts of this job as an apt source, add this to your /etc/apt/sources.list:" >&2
    echo "deb [trusted=yes arch=arm64] https://$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/reform-debian-packages/-/jobs/$CI_JOB_ID/artifacts/raw/repo $[[ inputs.oursuite ]] main"
